const BBOX={minLat:-1.06,maxLat:-0.84,minLon:100.3,maxLon:100.46};
const tb=document.getElementById("tb"), q=document.getElementById("q"), f=document.getElementById("f"), fc=document.getElementById("fc"), stats=document.getElementById("stats");
function bad(r){const la=parseFloat(r.latitude),lo=parseFloat(r.longitude);if(r.latitude==null||r.longitude==null||isNaN(la)||isNaN(lo))return "missing";if(la<BBOX.minLat||la>BBOX.maxLat||lo<BBOX.minLon||lo>BBOX.maxLon)return "outside";return "";}
function render(){
  const s=q.value.toLowerCase(), mode=f.value, cf=fc.value; let n=0, shown=0;
  tb.innerHTML="";
  for(const r of ROWS){
    const st=bad(r); const hay=(r.name+" "+(r.address||"")+" "+(r.description||"")).toLowerCase();
    if(s&&!hay.includes(s))continue;
    if(mode==="missing"&&st!=="missing")continue;
    if(mode==="outside"&&st!=="outside")continue;
    if(mode==="pantai"&&!r.categorySlugs.includes("pantai"))continue;
    if(mode==="kuliner"&&!r.categorySlugs.includes("kuliner"))continue;
    if(mode==="repo"&&r._origin!=="repo-hanya")continue;
    if(mode==="nocoord-pantai"&&!(st==="missing"&&r.categorySlugs.includes("pantai")))continue;
    if(cf&&!r.categorySlugs.includes(cf))continue;
    shown++;
    const tr=document.createElement("tr");
    if(st==="missing")tr.className="missing"; else if(st==="outside")tr.className="outside"; else if(r._origin==="repo-hanya")tr.className="repo";
    tr.innerHTML=
      '<td><input type="checkbox" '+(r._include?"checked":"")+' data-k="inc"></td>'+
      '<td><b>'+esc(r.name)+'</b> <span class="badge '+(r._origin==="edited"?"edited":"repo")+'">'+r._origin+'</span>'+(st?'<span class="badge warn">'+st+'</span>':"")+'<div class="addr">'+esc(r.address||"-")+'</div><div class="addr">'+esc((r.description||"").slice(0,140))+'</div><small class="hint">'+esc(r.canonicalKey||"")+' | '+esc(r.source||"")+'</small></td>'+
      '<td><input class="coord" data-k="lat" value="'+(r.latitude??"")+'" placeholder="-0.95"></td>'+
      '<td><input class="coord" data-k="lon" value="'+(r.longitude??"")+'" placeholder="100.36"></td>'+
      '<td><select multiple class="cats" data-k="cats">'+CATS.map(c=>'<option value="'+c+'"'+(r.categorySlugs.includes(c)?" selected":"")+'>'+c+'</option>').join("")+'</select></td>'+
      '<td><small class="hint">asal: '+esc((r.categorySlugs||[]).join(", "))+'</small><br><input type="text" data-k="note" placeholder="catatan..." style="width:120px"></td>';
    tr.querySelector('[data-k=inc]').addEventListener("change",e=>{r._include=e.target.checked;count();});
    tr.querySelector('[data-k=lat]').addEventListener("change",e=>{r.latitude=e.target.value.trim()===""?null:e.target.value.trim();paint();});
    tr.querySelector('[data-k=lon]').addEventListener("change",e=>{r.longitude=e.target.value.trim()===""?null:e.target.value.trim();paint();});
    tr.querySelector('[data-k=cats]').addEventListener("change",e=>{r.categorySlugs=[...e.target.selectedOptions].map(o=>o.value);});
    tb.appendChild(tr);
  }
  function paint(){render();}
  count(shown);
}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function count(shown){const inc=ROWS.filter(r=>r._include).length;const miss=ROWS.filter(r=>r._include&&(r.latitude==null||r.longitude==null)).length;stats.textContent="tampil: "+(shown??"?")+" | dipakai: "+inc+" | dipakai tanpa koordinat: "+miss;}
q.addEventListener("input",render); f.addEventListener("change",render); fc.addEventListener("change",render);
document.getElementById("checkAll").addEventListener("click",()=>{const s=q.value.toLowerCase();for(const r of ROWS){const hay=(r.name+" "+(r.address||"")).toLowerCase();if(!s||hay.includes(s)){r._include=true;}}render();});
document.getElementById("dl").addEventListener("click",()=>{
  const dests=ROWS.filter(r=>r._include).map(r=>({canonicalKey:r.canonicalKey||null,name:r.name,description:r.description||null,latitude:r.latitude==null||r.latitude===""?null:String(r.latitude),longitude:r.longitude==null||r.longitude===""?null:String(r.longitude),address:r.address||null,city:"Padang",source:r.source,sourcePlaceId:r.sourcePlaceId||null,isActive:true,imageUrl:r.imageUrl||null,details:r.details||{},categorySlugs:r.categorySlugs}));
  const out={exportedAt:new Date().toISOString(),scope:"Padang destinations validated",categories:CATS.map(s=>({slug:s,name:s[0].toUpperCase()+s.slice(1)})),destinations:dests};
  const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="destinations.padang.validated.json";a.click();
});
render();
